# BudaiAgentMesh 本地一键部署 (M1)
# 使用: docker compose up -d --build
# 访问: 前端 http://localhost:8080  后端 http://localhost:8000/docs

services:
  backend:
    build: ../backend
    container_name: budai-mesh-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://budai:budai@postgres:5432/budai_mesh
      JWT_SECRET: compose-dev-secret-change-me
      SECRET_KEY: compose-dev-secret-key-change-me
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build: ../frontend
    container_name: budai-mesh-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  postgres:
    image: postgres:16-alpine
    container_name: budai-mesh-postgres
    environment:
      POSTGRES_USER: budai
      POSTGRES_PASSWORD: budai
      POSTGRES_DB: budai_mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budai -d budai_mesh"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # M5 起启用: 事件流 / 对象存储 / 向量库
  # redis:
  #   image: redis:7-alpine
  # kafka:
  #   image: bitnami/kafka:3.7
  # minio:
  #   image: minio/minio:latest
  # milvus:
  #   image: milvusdb/milvus:v2.4

volumes:
  pgdata:
